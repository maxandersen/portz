project:
  name: portz
  version: earlyaccess
  description: A beautiful CLI tool to inspect and manage processes listening on your machine's ports
  license: MIT
  copyright: 2026 Max Rydahl Andersen
  authors:
    - Max Rydahl Andersen
  links:
    homepage: https://github.com/maxandersen/portz
    documentation: https://github.com/maxandersen/portz
  java:
    groupId: dk.xam
    artifactId: portz
    mainClass: io.quarkus.runner.GeneratedMain
    version: 25

release:
  github:
    overwrite: true
    tagName: earlyaccess
    releaseName: Early Access
    prerelease:
      enabled: true
    changelog:
      enabled: false
    update:
      enabled: true
      sections:
        - ASSETS

distributions:
  portz:
    type: SINGLE_JAR
    java:
      groupId: dk.xam
      artifactId: portz
    artifacts:
      - path: out/portz.jar
